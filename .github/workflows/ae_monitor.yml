name: OpenText Texas Enterprise Prospecting Monitor

on:
  schedule:
    # Runs Monday through Friday at 13:00 UTC (8:00 AM Central Standard Time)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual testing with a click

jobs:
  run-sales-intel:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Code Repository
      uses: actions/checkout@v3

    - name: Initialize Python Core
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Mount Operational Libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Extraction and Delivery
      env:
        PROXYCURL_API_KEY: ${{ secrets.PROXYCURL_API_KEY }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: python ./fetch_signals.py
